AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Assignment 3 - AI Photo Search. Creates the frontend bucket (B1), photos bucket (B2),
  index-photos (LF1) and search-photos (LF2) Lambdas, and the API Gateway with an API key.
  OpenSearch and the Lex bot are created separately and passed in as parameters.

Parameters:
  FrontendBucketName:
    Type: String
    Description: Globally unique name for the frontend bucket (B1)
  PhotosBucketName:
    Type: String
    Description: Globally unique name for the photos bucket (B2)
  IndexFunctionName:
    Type: String
    Default: index-photos
  SearchFunctionName:
    Type: String
    Default: search-photos
  EsEndpoint:
    Type: String
    Description: OpenSearch domain endpoint including https://
  EsUser:
    Type: String
  EsPassword:
    Type: String
    NoEcho: true
  BotId:
    Type: String
  BotAliasId:
    Type: String

Resources:
  # ---------- S3: frontend (B1) ----------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref FrontendBucketName
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${FrontendBucket}/*"

  # ---------- S3: photos (B2) ----------
  PhotosBucket:
    Type: AWS::S3::Bucket
    DependsOn: IndexFunctionS3Permission
    Properties:
      BucketName: !Ref PhotosBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:Put
            Function: !GetAtt IndexFunction.Arn

  PhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotosBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${PhotosBucket}/*"

  # ---------- IAM ----------
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: photo-search-access
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:HeadObject]
                Resource: !Sub "arn:aws:s3:::${PhotosBucketName}/*"
              - Effect: Allow
                Action: rekognition:DetectLabels
                Resource: "*"
              - Effect: Allow
                Action: lex:RecognizeText
                Resource: "*"
              - Effect: Allow
                Action: es:ESHttp*
                Resource: "*"

  ApiS3Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: apigateway.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: put-photos
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${PhotosBucketName}/*"

  # ---------- Lambdas (inline copies of lambda_index / lambda_search) ----------
  IndexFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref IndexFunctionName
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 30
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          ES_ENDPOINT: !Ref EsEndpoint
          ES_USER: !Ref EsUser
          ES_PASS: !Ref EsPassword
      Code:
        ZipFile: |
          import base64, json, os, urllib.parse
          import boto3, urllib3
          s3 = boto3.client("s3")
          rekognition = boto3.client("rekognition")
          http = urllib3.PoolManager()
          ES = os.environ["ES_ENDPOINT"].rstrip("/")
          AUTH = base64.b64encode(f"{os.environ['ES_USER']}:{os.environ['ES_PASS']}".encode()).decode()

          def lambda_handler(event, context):
              for record in event["Records"]:
                  bucket = record["s3"]["bucket"]["name"]
                  key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])
                  head = s3.head_object(Bucket=bucket, Key=key)
                  custom = head.get("Metadata", {}).get("customlabels", "")
                  labels = [l.strip().lower() for l in custom.split(",") if l.strip()]
                  resp = rekognition.detect_labels(Image={"S3Object": {"Bucket": bucket, "Name": key}}, MaxLabels=20, MinConfidence=70)
                  labels += [l["Name"].lower() for l in resp["Labels"]]
                  doc = {"objectKey": key, "bucket": bucket,
                         "createdTimestamp": head["LastModified"].strftime("%Y-%m-%dT%H:%M:%S"),
                         "labels": list(dict.fromkeys(labels))}
                  doc_id = urllib.parse.quote(f"{bucket}/{key}", safe="")
                  r = http.request("PUT", f"{ES}/photos/_doc/{doc_id}", body=json.dumps(doc),
                                   headers={"Content-Type": "application/json", "Authorization": f"Basic {AUTH}"})
                  print(f"Indexed {key}: {doc['labels']} -> {r.status} {r.data[:300]}")
              return {"statusCode": 200, "body": "ok"}

  IndexFunctionS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IndexFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::${PhotosBucketName}"

  SearchFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref SearchFunctionName
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 30
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          ES_ENDPOINT: !Ref EsEndpoint
          ES_USER: !Ref EsUser
          ES_PASS: !Ref EsPassword
          BOT_ID: !Ref BotId
          BOT_ALIAS_ID: !Ref BotAliasId
      Code:
        ZipFile: |
          import base64, json, os, uuid
          import boto3, urllib3
          lex = boto3.client("lexv2-runtime")
          http = urllib3.PoolManager()
          ES = os.environ["ES_ENDPOINT"].rstrip("/")
          AUTH = base64.b64encode(f"{os.environ['ES_USER']}:{os.environ['ES_PASS']}".encode()).decode()
          CORS = {"Access-Control-Allow-Origin": "*", "Content-Type": "application/json"}

          def singular(w):
              if w.endswith("ies") and len(w) > 4: return w[:-3] + "y"
              if w.endswith("es") and w[:-2].endswith(("ch", "sh", "x", "ss")): return w[:-2]
              if w.endswith("s") and not w.endswith("ss") and len(w) > 3: return w[:-1]
              return w

          def get_keywords(q):
              r = lex.recognize_text(botId=os.environ["BOT_ID"], botAliasId=os.environ["BOT_ALIAS_ID"],
                                     localeId="en_US", sessionId=str(uuid.uuid4()), text=q)
              slots = r.get("sessionState", {}).get("intent", {}).get("slots") or {}
              out = []
              for s in slots.values():
                  if s and s.get("value"):
                      v = s["value"].get("interpretedValue") or s["value"].get("originalValue")
                      if v: out.append(v)
              return out

          def search(keywords):
              terms = set()
              for k in keywords:
                  k = k.lower().strip()
                  terms.update([k, singular(k)])
              body = {"size": 100, "query": {"bool": {"should": [{"match": {"labels": t}} for t in terms]}}}
              r = http.request("GET", f"{ES}/photos/_search", body=json.dumps(body),
                               headers={"Content-Type": "application/json", "Authorization": f"Basic {AUTH}"})
              hits = json.loads(r.data).get("hits", {}).get("hits", [])
              return [{"url": f"https://{h['_source']['bucket']}.s3.amazonaws.com/{h['_source']['objectKey']}",
                       "labels": h["_source"]["labels"]} for h in hits]

          def lambda_handler(event, context):
              q = (event.get("queryStringParameters") or {}).get("q", "").strip()
              keywords = get_keywords(q) if q else []
              results = search(keywords) if keywords else []
              return {"statusCode": 200, "headers": CORS, "body": json.dumps({"results": results})}

  SearchFunctionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SearchFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PhotoApi}/*"

  # ---------- API Gateway ----------
  PhotoApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: AI Photo Search
      ApiKeySourceType: HEADER
      BinaryMediaTypes:
        - "image/*"
      Body:
        swagger: "2.0"
        info:
          title: AI Photo Search
          version: "1.0.0"
        schemes: [https]
        securityDefinitions:
          api_key:
            type: apiKey
            name: x-api-key
            in: header
        paths:
          /search:
            get:
              operationId: searchPhotos
              produces: [application/json]
              parameters:
                - name: q
                  in: query
                  required: false
                  type: string
              security:
                - api_key: []
              responses:
                "200":
                  description: search results
                  headers:
                    Access-Control-Allow-Origin: { type: string }
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SearchFunction.Arn}/invocations"
            options:
              consumes: [application/json]
              produces: [application/json]
              responses:
                "200":
                  description: CORS
                  headers:
                    Access-Control-Allow-Origin: { type: string }
                    Access-Control-Allow-Methods: { type: string }
                    Access-Control-Allow-Headers: { type: string }
              x-amazon-apigateway-integration:
                type: mock
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                      method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,x-api-key'"
          /photos/{object}:
            put:
              operationId: uploadPhoto
              produces: [application/json]
              parameters:
                - name: object
                  in: path
                  required: true
                  type: string
                - name: Content-Type
                  in: header
                  required: false
                  type: string
                - name: x-amz-meta-customLabels
                  in: header
                  required: false
                  type: string
              security:
                - api_key: []
              responses:
                "200":
                  description: uploaded
                  headers:
                    Access-Control-Allow-Origin: { type: string }
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: PUT
                credentials: !GetAtt ApiS3Role.Arn
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:s3:path/${PhotosBucketName}/{object}"
                passthroughBehavior: when_no_match
                contentHandling: CONVERT_TO_BINARY
                requestParameters:
                  integration.request.path.object: method.request.path.object
                  integration.request.header.Content-Type: method.request.header.Content-Type
                  integration.request.header.x-amz-meta-customLabels: method.request.header.x-amz-meta-customLabels
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
            options:
              consumes: [application/json]
              produces: [application/json]
              parameters:
                - name: object
                  in: path
                  required: true
                  type: string
              responses:
                "200":
                  description: CORS
                  headers:
                    Access-Control-Allow-Origin: { type: string }
                    Access-Control-Allow-Methods: { type: string }
                    Access-Control-Allow-Headers: { type: string }
              x-amazon-apigateway-integration:
                type: mock
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                      method.response.header.Access-Control-Allow-Methods: "'PUT,OPTIONS'"
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,x-api-key,x-amz-meta-customLabels'"

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    Properties:
      RestApiId: !Ref PhotoApi
      StageName: prod

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: ApiDeployment
    Properties:
      Name: photo-search-key
      Enabled: true

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiDeployment
    Properties:
      UsagePlanName: photo-search-plan
      ApiStages:
        - ApiId: !Ref PhotoApi
          Stage: prod

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

Outputs:
  WebsiteURL:
    Description: Public URL of the frontend
    Value: !GetAtt FrontendBucket.WebsiteURL
  ApiInvokeURL:
    Value: !Sub "https://${PhotoApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  ApiKeyId:
    Description: "Get the key value with: aws apigateway get-api-key --api-key <id> --include-value"
    Value: !Ref ApiKey
  PhotosBucket:
    Value: !Ref PhotosBucket
